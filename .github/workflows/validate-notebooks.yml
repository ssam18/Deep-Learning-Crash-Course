# Validate the chapter notebooks on every push and pull request.
#
# This repo is a bundle of Jupyter notebooks, not a pip-installable package,
# so the CI deliberately does NOT run pytest or install the heavy ML
# dependencies (TensorFlow, PyTorch, etc.).
#
# Each green check confirms that:
#   1. Every .ipynb parses as valid JSON (i.e. the file is not corrupt).
#   2. Every code cell parses with ast.parse (i.e. no Python syntax errors).
#
# The runtime is < 30 s.

name: Validate notebooks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate notebook JSON and Python syntax
        run: |
          python <<'PY'
          import json, ast, glob, sys
          errors = []
          for nb_path in sorted(glob.glob('Chapter_*/Chapter_*.ipynb')):
              try:
                  nb = json.load(open(nb_path))
              except Exception as e:
                  errors.append(f'{nb_path}: invalid JSON - {e}')
                  continue
              for i, c in enumerate(nb['cells']):
                  if c['cell_type'] != 'code':
                      continue
                  src = ''.join(c['source'])
                  try:
                      ast.parse(src)
                  except SyntaxError as e:
                      errors.append(f'{nb_path} cell {i}: {e}')
              print(f'OK  {nb_path}')
          if errors:
              print('\nFAILED:')
              for e in errors:
                  print('  ', e)
              sys.exit(1)
          PY
